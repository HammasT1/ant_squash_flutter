<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2D4D"/><stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36A"/><stop offset="1" stop-color="#FF5A3D"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A2A" stop-opacity="0"/><stop offset="0.5" stop-color="#FFD36A" stop-opacity="0.9"/><stop offset="1" stop-color="#FF8A2A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="84" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="84" fill="url(#bg)"/>
    <circle cx="860" cy="20" r="80" fill="#FF8A2A" opacity="0.13"><animate attributeName="cx" values="860;780;860" dur="9s" repeatCount="indefinite"/></circle>
    <rect width="7" height="84" fill="url(#bar)"/>
    <rect x="-300" y="81" width="300" height="3" fill="url(#sweep)"><animate attributeName="x" values="-300;900" dur="4.5s" repeatCount="indefinite"/></rect>
    <circle cx="52" cy="42.0" r="24" fill="#FFD36A" fill-opacity="0.92" stroke="#FF8A2A" stroke-opacity="0.9" stroke-width="2"/>
    <g transform="translate(52 42.0)"><animateTransform attributeName="transform" type="translate" values="52 40.0;52 44.0;52 40.0" dur="2.4s" repeatCount="indefinite"/>
      <image href="data:image/png;base64," x="-8" y="-12" width="17" height="24"/></g>
    <text x="96" y="38" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" letter-spacing="1">SEE IT IN ACTION</text>
    <text x="96" y="62" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9FB3D1" letter-spacing="0.5">Real frames rendered from the game itself</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="83" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
</svg>
