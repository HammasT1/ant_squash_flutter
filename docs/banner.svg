<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <g fill="#FF7A1A" opacity="0.12">
    <circle cx="80" cy="50" r="40"><animate attributeName="cy" values="50;70;50" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="200" r="55"><animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">
    ANT SQUASH
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9FB3D1">
    Protect the cake. Squash every ant.
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
  </text>
  <!-- marching ants -->
  <g font-size="26">
    <text y="230">🐜
      <animate attributeName="x" values="-40;940" dur="9s" repeatCount="indefinite"/>
    </text>
    <text y="230">🐜
      <animate attributeName="x" values="-40;940" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </text>
    <text y="230">🐜
      <animate attributeName="x" values="-40;940" dur="9s" begin="-6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
